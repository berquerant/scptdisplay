name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions-lock-verify:
    permissions:
      contents: read # checkout repository to verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.7.1

  ci:
    permissions:
      contents: read # checkout repository for Rust CI
    uses: berquerant/reusable-workflows/.github/workflows/rust-ci.yml@v0.7.1
    with:
      lint-command: make lint
      test-command: make test
      build-command: make build
