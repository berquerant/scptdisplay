name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -e
          rustup set profile minimal
          rustup install stable
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: build
        run: make build
