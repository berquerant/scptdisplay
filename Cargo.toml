[package]
name = "scptdisplay"
version = "0.2.0"
edition = "2021"
authors = ["berquerant"]
readme = "README.md"
repository = "https://github.com/berquerant/scptdisplay"

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
rmcp = { version = "3.4.0", features = ["macros", "server", "transport-io"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-std"] }
schemars = "1.2"